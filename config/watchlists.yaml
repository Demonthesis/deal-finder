# Deal Finder watchlists.
# Check with: dealfinder validate-config
#
# adapter:   ebay_api | api | rss | css | llm
# fetcher:   http (default) | browser   -- browser renders the page in headless Chromium,
#            for sites whose listings are built with JavaScript (needs the `browser` extra)
# condition: new | new_with_tags | open_box | refurbished | excellent | good | fair | used
#            (omit or leave empty to accept any condition)
# search_url: page to fetch for one item; {query} becomes the item's search text.
#            Without it the site's url is fetched as is (for a feed or category page).
# selectors: for adapter css -- listing, title, url (default a@href), price, condition;
#            each is a CSS selector, optionally ending in @attribute.
# interval_minutes (per site group): how often to check, default 60.
#
# The search URLs below are first guesses; each site gets checked properly in docs/sites.md.

site_groups:
  - name: resale-clothing
    interval_minutes: 30
    sites:
      - name: ebay
        url: https://www.ebay.com
        adapter: ebay_api
        rate_limit: {requests: 5, per_seconds: 1}
      - name: grailed
        url: https://www.grailed.com
        search_url: https://www.grailed.com/shop?query={query}
        adapter: llm
        fetcher: browser
        rate_limit: {requests: 1, per_seconds: 10}
      - name: poshmark
        url: https://poshmark.com
        search_url: https://poshmark.com/search?query={query}&type=listings
        adapter: llm
        rate_limit: {requests: 1, per_seconds: 15}

  - name: general-retail
    sites:
      - name: ebay
        url: https://www.ebay.com
        adapter: ebay_api
        rate_limit: {requests: 5, per_seconds: 1}
      - name: bestbuy
        url: https://www.bestbuy.com
        adapter: api
        rate_limit: {requests: 5, per_seconds: 1}
      # slickdeals: unsupported -- robots.txt disallows its RSS search (see docs/sites.md)

# Model for adapter llm. Key from ANTHROPIC_API_KEY (or api_key_env).
llm:
  provider: anthropic
  model: claude-haiku-5-5
  daily_token_budget: 2000000

# Where deal alerts go: console | discord | ntfy | telegram | email.
# Keys come from env vars (see README). quiet_hours and digest can also be set per item.
alerts:
  channel: console
  timezone: America/New_York
  quiet_hours: {start: "22:00", end: "07:00"}
  digest: false
  digest_time: "08:00"

watchlists:
  - name: Wardrobe upgrades
    site_group: resale-clothing
    items:
      - name: Patagonia Better Sweater
        keywords: [patagonia, better sweater, 1/4 zip]
        exclude: [womens, kids, vest]
        max_price: 45
        condition: [new_with_tags, excellent, good]
      - name: Red Wing Iron Ranger
        keywords: [red wing, iron ranger]
        exclude: [insoles, laces]
        max_price: 160
        digest: true

  - name: Buy soon
    site_group: general-retail
    items:
      - name: Sony WH-1000XM6
        keywords: [sony, wh-1000xm6]
        exclude: [case, ear pads, cable]
        max_price: 330
        currency: USD
        condition: [new, open_box, refurbished, excellent]
