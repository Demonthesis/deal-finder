[project]
name = "dealfinder"
version = "0.1.0"
description = "Watch resale and retail sites for deals that match your watchlists."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.13.0",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "pydantic>=2.7",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
dealfinder = "dealfinder.cli:app"

[project.optional-dependencies]
browser = [
    "playwright>=1.63.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
