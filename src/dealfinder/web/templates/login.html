<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Deal Finder</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; display: grid; place-items: center; min-height: 90vh; }
  form { display: flex; flex-direction: column; gap: .75rem; width: 260px; }
  input, button { font: inherit; padding: .5rem; }
  .bad { color: #b42318; }
</style></head>
<body>
<form method="post" action="/login">
  <h2>Deal Finder</h2>
  {% if error %}<div class="bad">{{ error }}</div>{% endif %}
  <input type="password" name="password" placeholder="Password" autofocus required>
  <input type="hidden" name="next" value="{{ next }}">
  <button>Log in</button>
</form>
</body>
</html>
