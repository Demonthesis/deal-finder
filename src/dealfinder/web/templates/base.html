<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Deal Finder{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
<style>
  :root { --fg: #1d2330; --muted: #667085; --line: #e4e7ec; --bg: #f8f9fb; --accent: #2156d9;
          --good: #157f3d; --bad: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e6e8ee; --muted: #98a2b3; --line: #2d3443; --bg: #12161f; --accent: #7aa2ff;
            --good: #4ade80; --bad: #f97066; }
    input, select, textarea, button { background: #1b2130; color: var(--fg); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  header { display: flex; gap: 1.5rem; align-items: center; padding: .75rem 1.5rem;
           border-bottom: 1px solid var(--line); }
  header strong { margin-right: 1rem; }
  header a { color: var(--fg); text-decoration: none; }
  header a.active { color: var(--accent); font-weight: 600; }
  header form { margin-left: auto; }
  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
  a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--line);
           vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: .85rem; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-size: .85rem; }
  .good { color: var(--good); } .bad { color: var(--bad); }
  .errors { border: 1px solid var(--bad); color: var(--bad); padding: .5rem 1rem; border-radius: 6px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 1rem 0; padding: 1rem; }
  label { display: inline-flex; flex-direction: column; margin: 0 .75rem .5rem 0; font-size: .85rem;
          color: var(--muted); }
  label.check { flex-direction: row; gap: .25rem; align-items: center; }
  input, select, button { font: inherit; padding: .3rem .5rem; border: 1px solid var(--line);
                          border-radius: 6px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  button.link { border: 0; background: none; color: var(--bad); padding: 0; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  .row { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; }
  details summary { cursor: pointer; color: var(--accent); }
</style>
</head>
<body>
<header>
  <strong>Deal Finder</strong>
  {% set path = request.url.path %}
  <a href="/" class="{{ 'active' if path == '/' }}">Deals</a>
  <a href="/watchlists" class="{{ 'active' if path.startswith('/watchlists') }}">Watchlists</a>
  <a href="/sites" class="{{ 'active' if path.startswith('/sites') }}">Sites</a>
  <a href="/runs" class="{{ 'active' if path.startswith('/runs') }}">Runs</a>
  {% if auth %}<form method="post" action="/logout"><button>Log out</button></form>{% endif %}
</header>
<main>
{% if errors %}<div class="errors"><strong>Not saved:</strong><ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
